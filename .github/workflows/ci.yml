name: gates

# 三条红线都在这跑:manifest(§3.1 dependencies 为空 + 无 dsh-* peer,A10)、§3.1 冻结口径的体积、
# 以及 Windows 上的还原路径(§9 平台差异:`rename` 被占用即失败,A5 必须在 Windows 实测)。

on:
  push:
  pull_request:

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # 版本从根 package.json 的 packageManager 字段读,不在此处写死
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:manifest
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm run check:size
